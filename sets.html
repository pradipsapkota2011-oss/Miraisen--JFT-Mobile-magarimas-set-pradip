<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Miraisen JFT Mock Test Sets</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef1f3;color:#111;min-height:100vh}.header{background:#101010;color:#fff;padding:24px 18px}.header-inner{max-width:650px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:15px}.header h1{margin:0;font-size:24px}.header p{margin:6px 0 0;color:#ccc;font-size:14px}.logout-btn{background:#ffdc95;color:#111;border:none;border-radius:8px;padding:10px 18px;font-weight:bold;cursor:pointer}.green-line{height:12px;background:#5b922b}.container{width:min(600px,94%);margin:28px auto 40px}.welcome{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px 18px;margin-bottom:20px}.welcome-title{font-weight:bold;margin-bottom:5px}#userEmail{color:#555;font-size:14px}.set-card{background:#fff;border:1px solid #d5d5d5;border-radius:14px;margin-bottom:16px;padding:20px;box-shadow:0 4px 14px rgba(0,0,0,.07)}.set-number{display:inline-block;background:#101010;color:#fff;padding:6px 12px;border-radius:6px;font-size:13px;font-weight:bold;margin-bottom:12px}.google-set-number{background:#b3261e}.set-card h2{margin:0 0 6px;font-size:21px}.set-card p{color:#666;margin:0 0 16px;font-size:14px}.start-btn{width:100%;border:none;background:#5b922b;color:#fff;padding:15px;font-size:17px;font-weight:bold;border-radius:9px;cursor:pointer}.google-form-btn{background:#b3261e}.start-btn:hover{background:#4c7d23}.google-form-btn:hover{background:#8e1d17}.start-btn:active{transform:scale(.99)}#loadingScreen{position:fixed;inset:0;background:#eef1f3;z-index:9999;display:flex;align-items:center;justify-content:center;text-align:center}.loading-box{background:#fff;padding:25px;border-radius:12px;border:1px solid #ddd;width:min(400px,90%)}.loading-box h2{margin-top:0}#errorBox{display:none;background:#fff0f0;color:#8d0000;border:1px solid #efbbbb;border-radius:10px;padding:15px;margin-bottom:20px}@media(max-width:600px){.header-inner{align-items:flex-start}.header h1{font-size:20px}.logout-btn{padding:9px 12px}.container{margin-top:18px}.set-card{padding:17px}}
</style>
</head>
<body>
<div id="loadingScreen"><div class="loading-box"><h2>Miraisen JFT</h2><p>Login verification हुँदैछ...</p></div></div>
<div class="header"><div class="header-inner"><div><h1>Miraisen JFT Mock Test</h1><p>Select your Mock Test Set</p></div><button class="logout-btn" id="logoutBtn" type="button">Logout</button></div></div>
<div class="green-line"></div>
<div class="container">
  <div id="errorBox"></div>
  <div class="welcome"><div class="welcome-title">Welcome, Approved Student</div><div id="userEmail">Checking account...</div></div>
  <div id="allSets"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
<script>
let auth=null,db=null;
const sets=[
{number:1,title:"かわいい",type:"html",link:"https://pradipsapkota2011-oss.github.io/Miraisen--JFT-kawai/"},
{number:2,title:"くだもの",type:"html",link:"https://pradipsapkota2011-oss.github.io/Miraisen--JFT2026-kudamono/"},
{number:3,title:"てつだいます",type:"html",link:"https://pradipsapkota2011-oss.github.io/Miraisen--JFT-tetsudau/"},
{number:4,title:"かざります",type:"html",link:"https://pradipsapkota2011-oss.github.io/Miraisen--JFT-New-Mix-Set/"},
{number:5,title:"まがります",type:"html",link:"https://pradipsapkota2011-oss.github.io/Miraisen--JFT-Mobile-magarimas-set-pradip/"},
{number:6,title:"トイレ",type:"form",link:"https://docs.google.com/forms/d/e/1FAIpQLSeCnxPT_BpDjbiTWjlTIrbwbkRwjzzdlExKkRP-B-TMC-NWJw/viewform?usp=header"},
{number:7,title:"そら",type:"form",link:"https://docs.google.com/forms/d/e/1FAIpQLSdN298iRrjA-ULG56vqDrsI3jskZvdM8uELRI1pjM2_J09Z_g/viewform?usp=header"},
{number:8,title:"くろい",type:"form",link:"https://docs.google.com/forms/d/e/1FAIpQLSfjei9_0TNp0Ap83lgHmgTkSlOZllZviBhN2uo6tCfTX62FHA/viewform?usp=header"},
{number:9,title:"くつした",type:"form",link:"https://docs.google.com/forms/d/e/1FAIpQLScwNGz52lGLKeOH0nGcKpcUZhVXP9Q8zQFNdhV2wBM-Z1TBjQ/viewform?usp=header"},
{number:10,title:"サラダ・にげます",type:"form",link:"https://docs.google.com/forms/d/e/1FAIpQLSezh2VKeSXQpbZ7HNK6_Rdd0lP1IJIVmP0DZUmRSdbD3fCHlw/viewform?usp=publish-editor"},
{number:11,title:"たな・せき",type:"form",link:"https://docs.google.com/forms/d/e/1FAIpQLSdQNYOiRdSsTxh3gBST12DMB8wwMwgqq4z5RbE84I6-Dozduw/viewform?usp=header"},
{number:12,title:"お母さん",type:"form",link:"https://docs.google.com/forms/d/e/1FAIpQLSeAmbCsPUvsWscukH35VmUkfVWtba_q7auaQourkIsrSy72-w/viewform?usp=header"},
{number:13,title:"公園",type:"form",link:"https://docs.google.com/forms/d/e/1FAIpQLSdbt5-P46kUFZpR831xUjnFTilAsk0kR-wtF6lkyb8BZ2MjhQ/viewform?usp=header"},
{number:14,title:"たな",type:"form",link:"https://docs.google.com/forms/d/e/1FAIpQLSeNafuIuYAIGgYY7hKZyIc_omjjutGsEb--ko2IMFVOkfxy6w/viewform?usp=header"},
{number:15,title:"げんかん",type:"form",link:"https://docs.google.com/forms/d/e/1FAIpQLSfi0yLUZj-i_9znaBhiB_Jj7P638BozrGcVUpHsNLGWfFkuhg/viewform?usp=header"},
{number:16,title:"さいふ",type:"form",link:"https://docs.google.com/forms/d/e/1FAIpQLSfb8mxPkgUd67zDkCmDV6S1GXyxcvzpUbzMYFmsJx1Wk8oFFg/viewform?usp=header"},
{number:17,title:"起きます",type:"form",link:"https://docs.google.com/forms/d/e/1FAIpQLSf6EhQOyGg6PeCbDYjAp9w5ZbhnY_0ehAb8-BANH3jIEpTB2g/viewform?usp=header"},
{number:18,title:"じむしつ",type:"form",link:"https://docs.google.com/forms/d/e/1FAIpQLSe-ToilytU4wQKIBAMjAp_CioqdkD8anWJ-DvatjKH_qSw9jQ/viewform?usp=header"},
{number:19,title:"自転車",type:"form",link:"https://docs.google.com/forms/d/e/1FAIpQLSeH4v1fur_8h3tDJY2vD_XrrQ-uny_UXE-xApR8UuZOfhypsA/viewform?usp=header"},
{number:20,title:"バス",type:"form",link:"https://docs.google.com/forms/d/e/1FAIpQLSfe2S4eNAE-q8zKEgegT7jeZnIZ-MYbDvXlc5-g19TVADW-0g/viewform?usp=header"},
{number:21,title:"サラダ",type:"form",link:"https://docs.google.com/forms/d/e/1FAIpQLSeY--nWiQBcVEtFclYBKfoHBt0-UbAH79YCZw_LHUPihpqSLg/viewform?usp=header"},
{number:22,title:"そば",type:"form",link:"https://docs.google.com/forms/d/e/1FAIpQLSeQxfFB4CkqZRPmdiQjev1PWuGU_Et4l6VUmugNzMFiJ5AbwQ/viewform?usp=header"},
{number:23,title:"コーヒー",type:"form",link:"https://docs.google.com/forms/d/e/1FAIpQLSciTns1RVMLA5ujJl_FiafwmZ_G4lGr3NcoQSlSYnfBcaevlQ/viewform?usp=header"},
{number:24,title:"父",type:"form",link:"https://docs.google.com/forms/d/e/1FAIpQLSf842znyHBrmQBaru8jok7lYbQP5aqKr6vjpghkWT9F_FiCaA/viewform?usp=header"},
{number:25,title:"パンダ",type:"form",link:"https://docs.google.com/forms/d/e/1FAIpQLSfbm8FlobPfCCfJ4ZWlOnrQ844NwHTYORDi_Tc__5DWTXE6Vg/viewform?usp=header"}
];
function displaySets(){document.getElementById("allSets").innerHTML=sets.map(s=>`<div class="set-card"><div class="set-number ${s.type==='form'?'google-set-number':''}">SET ${s.number}</div><h2>${s.title}</h2><p>JFT Mock Test Set ${s.number}</p><button class="start-btn ${s.type==='form'?'google-form-btn':''}" type="button" onclick="openSet('${s.link}')">Start Set ${s.number}</button></div>`).join("")}
function extractObject(text,name){const re=new RegExp('export\\s+const\\s+'+name+'\\s*=\\s*({[\\s\\S]*?})\\s*;');const match=text.match(re);if(!match)throw new Error(name+' firebase-config.js मा भेटिएन।');return Function('"use strict";return ('+match[1]+')')()}
async function initFirebase(){try{const response=await fetch('./firebase-config.js',{cache:'no-store'});if(!response.ok)throw new Error('firebase-config.js load भएन।');const text=await response.text();const firebaseConfig=extractObject(text,'firebaseConfig');if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore();await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);checkLogin()}catch(error){showError(error.message||error)}}
function checkLogin(){auth.onAuthStateChanged(async user=>{if(!user){location.replace('login.html');return}try{await user.getIdToken(true);const snap=await db.collection('users').doc(user.uid).get();if(!snap.exists){await auth.signOut();location.replace('login.html');return}const status=String(snap.data().accessStatus||'').toLowerCase();if(status!=='approved'){await auth.signOut();location.replace('login.html');return}document.getElementById('userEmail').textContent=user.email||'Approved User';document.getElementById('loadingScreen').style.display='none'}catch(error){showError(error.message||error)}})}
function openSet(url){if(!auth||!auth.currentUser){location.href='login.html';return}location.href=url}
document.getElementById('logoutBtn').onclick=async()=>{try{if(auth)await auth.signOut()}catch(e){}location.replace('login.html')};
function showError(message){document.getElementById('loadingScreen').style.display='none';const box=document.getElementById('errorBox');box.style.display='block';box.textContent='Error: '+message}
displaySets();initFirebase();
</script>
</body>
</html>
